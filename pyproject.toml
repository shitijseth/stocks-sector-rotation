[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-rotation"
version = "0.1.0"
description = "Multi-layer thematic tagging and sector-rotation analysis for US-listed stocks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "etf-scraper>=0.1.2",
    "click>=8.1",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]
dashboard = ["streamlit>=1.32", "plotly>=5.20"]
dev = ["ruff", "pytest"]

[project.scripts]
sector-rotation = "sector_rotation.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
